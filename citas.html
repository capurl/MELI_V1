<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas de Ensueño</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="checklist-container">
        <h2>Citas de Noviecitos</h2>
        
        <!-- Nueva sección para agregar citas -->
        <div class="add-section" style="text-align: center; margin-bottom: 20px;">
            <input type="text" id="nuevaCitaInput" placeholder="Escribe una nueva cita..." style="padding: 8px; width: 60%; border-radius: 5px; border: 1px solid #ccc; font-family: 'Poppins', sans-serif;">
            <button id="btnAgregar" style="padding: 8px 15px; border-radius: 5px; background-color: #ffb6c1; border: none; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 500;">Agregar</button>
        </div>

        <div class="list-section">
            <h3>Sueños y citas juntos por cumplir ✨</h3>
            <!-- La lista ya está vacía, con su ID para que app.js la llene -->
            <ul class="dream-list" id="listaPendientes"></ul>
        </div>

        <div class="list-section">
            <h3>Citas completadas 💗</h3>
            <!-- La lista ya está vacía, con su ID para que app.js la llene -->
            <ul class="completed-list" id="listaCompletadas"></ul>
        </div>
    </div>

    <!-- Tu botón de regreso al índice original -->
    <a href="indice.html" class="back-link" title="Volver al Índice">
        <span class="fa-stack fa-2x">
            <i class="fas fa-star fa-stack-2x"></i>
            <i class="fas fa-arrow-left fa-stack-1x"></i>
        </span>
    </a>
<!-- =========================================
         VENTANA EMERGENTE (MODAL DE RECUERDO)
         ========================================= -->
    <div id="modalRecuerdo" class="modal-overlay">
        <div class="scrapbook-card">
            <!-- Botón para cerrar -->
            <span class="close-modal" id="btnCerrarModal">&times;</span>

            <div class="header-row">
                <div class="title-section">
                    <h1>Cita # <span id="modalNumCita" style="font-size: 1.5rem; border-bottom: 2px solid #ff8fa3; padding: 0 10px;">1</span></h1>
                    <input type="text" id="modalTitulo" class="title-input" placeholder="Nombre de la cita..." readonly>
                </div>
                
                <div class="rating-section">
                    <p>Calificación de esta cita</p>
                    <div class="hearts" id="modalEstrellas">
                        <i class="far fa-heart" data-valor="1"></i>
                        <i class="far fa-heart" data-valor="2"></i>
                        <i class="far fa-heart" data-valor="3"></i>
                        <i class="far fa-heart" data-valor="4"></i>
                        <i class="far fa-heart" data-valor="5"></i>
                    </div>
                </div>
            </div>

            <div class="content-grid">
                <!-- Columna Izquierda -->
                <div class="col-izq">
                    <div class="polaroid" id="btnSubirFoto">
                        <div class="polaroid-photo">
                            <i class="fas fa-camera"></i>
                            <!-- Aquí irá la imagen real después -->
                        </div>
                        <p>La mejor foto del día</p>
                    </div>
                    
                    <div>
                        <label style="font-size: 0.85rem; color: #666;">Fecha:</label>
                        <input type="date" id="modalFecha" class="input-line">
                    </div>
                    
                    <div>
                        <label style="font-size: 0.85rem; color: #666;">Lugar:</label>
                        <input type="text" id="modalLugar" class="input-line" placeholder="¿Dónde fue?">
                    </div>
                </div>
                
                <!-- Columna Derecha -->
                <div class="col-der">
                    <div class="box-decorated" style="border-radius: 5px;">
                        <label style="font-size: 0.9rem;">Describe esta cita con una sola palabra</label>
                        <input type="text" id="modalPalabra" class="input-line" placeholder="..." style="border-bottom: none; background: #fff; padding-left: 5px; border-radius: 3px;">
                    </div>
                    
                    <div class="box-decorated" style="flex-grow: 1;">
                        <label>Lo mejor de la cita:</label>
                        <textarea id="modalMejor" placeholder="Escribe aquí los mejores momentos..."></textarea>
                    </div>
                </div>
            </div>
            
            <button class="btn-guardar" id="btnGuardarRecuerdo">Guardar Recuerdo 📸</button>
        </div>
    </div>
    <!-- Fin del Modal -->

    <!-- script bd -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
